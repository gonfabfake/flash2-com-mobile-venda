<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05080f">
<title>DDTank Mobile</title>

<!--
  BUG CORRIGIDO: este arquivo vivia em /mobile/ e carregava "DDT_Loading_Air.swf"
  por caminho RELATIVO, ou seja, /mobile/DDT_Loading_Air.swf — que não existe
  (o SWF está na raiz). O jogo abria uma tela preta.
  A tag <base> abaixo faz todos os caminhos relativos resolverem a partir da raiz
  do site, exatamente como o player.html da raiz.
-->
<base href="../">

<link rel="stylesheet" href="assets/mobile/css/mobile-controls.css">
</head>
<body>

<div id="stageWrap">
  <div id="stage" aria-label="Área do jogo"></div>
</div>

<div id="touchControls" hidden></div>

<div id="rotateHint" hidden>Gire o aparelho para a horizontal para jogar.</div>

<div id="startGate" hidden>
  <h1>DDTank</h1>
  <p>Toque para iniciar em tela cheia.<br>O áudio só é liberado após o primeiro toque.</p>
  <div class="start-cta">▶ Começar</div>
</div>

<div id="toastHost"></div>
<div id="modalHost"></div>
<div id="zoomIndicator" hidden></div>
<pre id="diagPanel" hidden></pre>

<script src="vendor/ruffle/ruffle.js"></script>
<script type="module" src="assets/mobile/js/main.js"></script>

<noscript>
  <div style="padding:24px;font:16px system-ui;color:#eaf6ff">
    Este jogo precisa de JavaScript. Ative o JavaScript e recarregue a página.
  </div>
</noscript>

</body>
</html>
