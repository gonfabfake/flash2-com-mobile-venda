<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05080f">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<title>DDTank Mobile</title>

<link rel="stylesheet" href="assets/mobile/css/mobile-controls.css">
</head>
<body>

<!-- ───────────────────────── área do jogo ───────────────────────── -->
<div id="stageWrap">
  <div id="stage" aria-label="Área do jogo"></div>
</div>

<!-- ───────────────────────── painel tátil ───────────────────────── -->
<!-- pointer-events:none no contêiner: o painel não bloqueia o campo de batalha -->
<div id="touchControls" hidden></div>

<!-- ───────────────────────── telas auxiliares ───────────────────── -->
<div id="rotateHint" hidden>Gire o aparelho para a horizontal para jogar.</div>

<div id="startGate" hidden>
  <h1>DDTank</h1>
  <p>Toque para iniciar em tela cheia.<br>O áudio só é liberado após o primeiro toque.</p>
  <div class="start-cta">▶ Começar</div>
</div>

<div id="toastHost"></div>
<div id="modalHost"></div>
<div id="zoomIndicator" hidden></div>
<pre id="diagPanel" hidden></pre>

<!-- ───────────────────────── runtime ────────────────────────────── -->
<!--
  NOTA DE COMPATIBILIDADE (ETAPA 5 — preservar versão PC):
  · O `?swf=` continua aceito e tem o mesmo default de antes (DDT_Loading_Air.swf).
  · Todos os parâmetros da URL continuam virados em flashvars, como fazia o
    player.html original (linhas 50-56 do arquivo anterior).
  · O teclado do desktop NÃO é interceptado em momento algum — o painel só
    aparece quando há toque e não há cursor fino.
-->
<script src="vendor/ruffle/ruffle.js"></script>
<script type="module" src="assets/mobile/js/main.js"></script>

<noscript>
  <div style="padding:24px;font:16px system-ui;color:#eaf6ff">
    Este jogo precisa de JavaScript. Ative o JavaScript e recarregue a página.
  </div>
</noscript>

</body>
</html>
